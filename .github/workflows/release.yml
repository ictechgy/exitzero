name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare the pinned build backend
        run: python -m pip install setuptools==79.0.1 build==1.2.2.post1
      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$version"
      - name: Build the dependency-free wheel and sdist
        run: |
          python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
          python -m build --sdist --no-isolation --outdir dist
      - name: Verify the installed wheel and actual Git commits offline
        run: python scripts/release_check.py --wheel dist/exitzero-*.whl
      - name: Preserve distribution and installed-package evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            dist/
            .exitzero/releases/
          include-hidden-files: true
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
