name: aidd-gate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the same offline gate as local development
        run: python scripts/ci.py
      - name: Preserve receipts and fixture evidence on every outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-evidence-${{ matrix.python-version }}
          path: |
            .aidd-gate/
            examples/sample/.aidd-gate/
          include-hidden-files: true
