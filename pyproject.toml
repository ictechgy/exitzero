[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exitzero"
version = "0.3.0"
description = "Offline policy and verification gates for AI-assisted coding teams"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.scripts]
exitzero = "exitzero.cli:main"

[project.entry-points."exitzero.plugins"]
verify = "exitzero_verify"
harness = "exitzero_harness"

[tool.setuptools]
packages = ["exitzero", "exitzero_verify", "exitzero_harness", "exitzero_mcp_gateway", "exitzero_mcp_gate", "exitzero_ledger"]
package-dir = {exitzero = "packages/core/src/exitzero", exitzero_verify = "packages/plugin-verify/src/exitzero_verify", exitzero_harness = "packages/plugin-harness/src/exitzero_harness", exitzero_mcp_gateway = "packages/plugin-mcp-gateway/src/exitzero_mcp_gateway", exitzero_mcp_gate = "packages/plugin-mcp-gate/src/exitzero_mcp_gate", exitzero_ledger = "packages/plugin-ledger/src/exitzero_ledger"}
