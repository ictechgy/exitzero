# Optional recipe for trusted same-repository changes; not an enabled workflow.
name: exitzero attested gate
on: [pull_request, merge_group]
jobs:
  gate:
    name: exitzero-attested
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require a trusted validation path for fork changes
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Pin a reviewed release supporting your policy. Unreleased features
      # require an independently built/reviewed wheel until publication.
      - run: python -m pip install exitzero==0.3.0
      # Install this project's test dependencies here.
      - name: Run a fresh full gate
        run: |
          mkdir -p .exitzero
          exitzero check --format json > .exitzero/ci-receipt.json
      - name: Attest the receipt artifact from this successful job
        uses: actions/attest@v4
        with:
          subject-path: .exitzero/ci-receipt.json
      - name: Retain receipts on success and failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exitzero-${{ github.sha }}-${{ github.run_attempt }}
          path: .exitzero/*.json
          include-hidden-files: true
          if-no-files-found: error
