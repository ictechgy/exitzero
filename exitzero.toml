version = 1
plugins = ["exitzero_verify", "exitzero_harness", "exitzero_mcp_gateway", "exitzero_mcp_gate", "exitzero_ledger"]

[[checks]]
id = "syntax"
kind = "python.syntax"
paths = ["packages/**/*.py", "scripts/*.py", "tests/test_*.py"]

[[checks]]
id = "imports"
kind = "python.imports"
paths = ["packages/**/*.py"]
[checks.options]
roots = ["packages/core/src", "packages/plugin-verify/src", "packages/plugin-harness/src", "packages/plugin-mcp-gateway/src", "packages/plugin-mcp-gate/src", "packages/plugin-ledger/src"]
allow_modules = []

[[checks]]
id = "test-quality"
kind = "python.test-quality"
paths = ["tests/test_*.py"]

[[checks]]
id = "regression-suite"
kind = "command"
paths = ["packages/**/*.py", "scripts/run_tests.py", "tests/test_*.py"]
[checks.options]
argv = ["{python}", "scripts/run_tests.py"]
timeout = 120

[harness]
config_files = ["agent-plugin/.mcp.json"]
rules = [{id = "completion-evidence", value = "Require runner exit codes and persisted receipts before claiming completion."}]

[[checks]]
id = "verifier-connections"
kind = "python.connections"
paths = ["packages/plugin-verify/src/exitzero_verify/*.py"]
[checks.options]
roots = ["packages/plugin-verify/src"]

[[checks.options.connections]]
source = "packages/plugin-verify/src/exitzero_verify/__init__.py"
target = "packages/plugin-verify/src/exitzero_verify/connections.py"
symbol = "check_connections"
within = "register"
usage = "argument"
consumer = "registry.add_check"

[[checks.options.connections]]
source = "packages/plugin-verify/src/exitzero_verify/__init__.py"
target = "packages/plugin-verify/src/exitzero_verify/agentwarden.py"
symbol = "check_agentwarden"
within = "register"
usage = "argument"
consumer = "registry.add_check"
